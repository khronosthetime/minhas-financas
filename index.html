/* Tema escuro único, inspirado em Kalshi + Pierre */
:root{
  --brand:#28CC95; --on-brand:#08120D;
  --bg:#0A0C0F; --surface:#14181E; --surface-2:#1C2129;
  --border:rgba(255,255,255,.10); --text:rgba(255,255,255,.95); --muted:rgba(255,255,255,.55);
  --pos:#28CC95; --neg:#FF5C6C; --warn:#F5B94A;
  --r-card:14px; --r-ui:11px; --r-step:8px;
  --focus:0 0 0 3px rgba(40,204,149,.20);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:16px; line-height:1.4; overscroll-behavior-y:none;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:16px;}
.tnum{font-variant-numeric:tabular-nums;}

#app{max-width:520px; margin:0 auto; min-height:100vh; padding-bottom:calc(84px + var(--safe-bot)); position:relative;}

/* Top bar */
.topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:saturate(160%) blur(14px); -webkit-backdrop-filter:saturate(160%) blur(14px); padding:calc(var(--safe-top) + 14px) 20px 12px; border-bottom:.8px solid var(--border);}
.topbar h1{margin:0; font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);}
.top-row{display:flex; align-items:center; justify-content:space-between;}
.eye-btn{width:30px; height:30px; display:grid; place-items:center; color:var(--muted); border-radius:8px;}
.eye-btn:active{background:var(--surface);}
.eye-btn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.priv .tnum{filter:blur(8px); transition:filter .12s;}
.priv .rentab{filter:blur(6px);}
.tx-search{width:100%; padding:10px 14px; border:.8px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text); outline:none; font-size:14px; margin:0 0 12px; -webkit-appearance:none;}
.tx-search:focus{border-color:var(--brand); box-shadow:var(--focus);}
.month-nav{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
.month-nav .m{font-size:20px; font-weight:700; letter-spacing:-.01em; text-transform:capitalize;}
.month-nav button{width:38px; height:38px; border-radius:var(--r-ui); border:.8px solid var(--border); background:var(--surface); display:grid; place-items:center; color:var(--text); font-size:18px; font-weight:600;}
.month-nav button:active{background:var(--surface-2);}

.screen{padding:18px 20px 0; display:none;}
.screen.active{display:block; animation:fade .22s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion:reduce){.screen.active,.sheet,.sheet-bg{animation:none!important;}}

/* Hero */
.hero{background:transparent; color:var(--text); padding:8px 2px 20px;}
.hero .lbl{font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--muted);}
.hero .val{font-size:42px; font-weight:700; letter-spacing:-.025em; margin-top:6px; line-height:1; color:var(--text);}
.hero .sub{font-size:12.5px; color:var(--muted); margin-top:12px;}

.tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
.tile{background:var(--surface); border:.8px solid var(--border); border-radius:var(--r-card); padding:14px 15px;}
.tile .lbl{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:6px;}
.tile .lbl::before{content:""; width:8px; height:8px; border-radius:50%;}
.tile.pos .lbl::before{background:var(--pos);}
.tile.neg .lbl::before{background:var(--muted);}
.tile .v{font-size:19px; font-weight:700; margin-top:7px; letter-spacing:-.01em;}
.tile.pos .v{color:var(--pos);} .tile.neg .v{color:var(--neg);}

.sec-title{font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:26px 2px 12px; display:flex; justify-content:space-between; align-items:center;}
.sec-title button{font-size:12px; font-weight:600; color:var(--brand); letter-spacing:0; text-transform:none;}

/* Category breakdown bars */
.cat-bars{display:flex; flex-direction:column; gap:12px;}
.cbar{cursor:pointer; padding:4px 6px; margin:-4px -6px; border-radius:10px; -webkit-tap-highlight-color:transparent;}
.cbar:active{background:var(--surface);}
.cat-bars.filtering .cbar{opacity:.34; transition:opacity .15s ease;}
.cat-bars.filtering .cbar.on{opacity:1;}
.cbar.on .nm{color:var(--brand);}
.cbar.on .track{box-shadow:0 0 0 1px color-mix(in srgb, var(--brand) 40%, transparent);}
.donut-wrap{display:flex; justify-content:center; margin:6px 0 22px;}
.donut-box{position:relative; width:132px; height:132px;}
.donut-box svg circle{transition:stroke-dasharray .4s ease;}
.donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
.donut-lbl{font-size:10px; color:var(--muted); font-weight:600; letter-spacing:.09em; text-transform:uppercase;}
.donut-val{font-size:16px; font-weight:700; margin-top:2px;}
.pamt{display:flex; flex-direction:column; align-items:flex-end; gap:2px;}
.rentab{font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums;}
.rentab.up{color:var(--pos);}
.rentab.down{color:var(--neg);}
.cbar .row{display:flex; justify-content:space-between; font-size:13.5px; font-weight:600; margin-bottom:6px;}
.cbar .row .nm{display:flex; align-items:center; gap:8px;}
.dot{width:10px; height:10px; border-radius:50%; flex:none;}
.track{height:7px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
.track > i{display:block; height:100%; border-radius:999px;}

/* Transaction list */
.day-group{margin-bottom:6px;}
.day-head{font-size:12px; font-weight:600; color:var(--muted); margin:16px 2px 8px; text-transform:capitalize;}
.tx{display:flex; align-items:center; gap:13px; background:transparent; border:none; border-top:.8px solid var(--border); border-radius:8px; padding:13px 4px; margin:0; width:100%; text-align:left;}
.tx:active{background:var(--surface);}
.tx .ic{width:34px; height:34px; border-radius:9px; flex:none; display:grid; place-items:center; font-size:13px; font-weight:700; color:#fff;}
.tx .mid{flex:1; min-width:0;}
.tx .nm{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tx .mt{font-size:12px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.tx .amt{font-size:15px; font-weight:700; white-space:nowrap; letter-spacing:-.01em;}
.tx .amt.pos{color:var(--pos);} .tx .amt.neg{color:var(--text);}

/* Bills */
.bill{display:flex; align-items:center; gap:12px; background:var(--surface); border:.8px solid var(--border); border-radius:var(--r-ui); padding:13px 14px; margin-bottom:9px;}
.bill .chk{width:26px; height:26px; border-radius:8px; border:.8px solid var(--border); flex:none; display:grid; place-items:center; background:var(--surface-2); color:var(--on-brand); font-size:15px; font-weight:700;}
.bill.paid .chk{background:var(--pos); border-color:var(--pos);}
.bill .mid{flex:1; min-width:0;}
.bill .nm{font-size:14.5px; font-weight:600;}
.bill.paid .nm{text-decoration:line-through; color:var(--muted);}
.bill .mt{font-size:12px; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:7px;}
.pill{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 8px; border-radius:999px; border:.8px solid var(--border);}
.pill.open{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 40%, var(--border));}
.pill.late{color:var(--neg); border-color:color-mix(in srgb,var(--neg) 45%, var(--border));}
.pill.ok{color:var(--pos); border-color:color-mix(in srgb,var(--pos) 45%, var(--border));}
.bill .amt{font-size:15px; font-weight:700; text-align:right;}
.bill .edit{width:30px; height:30px; border-radius:8px; display:grid; place-items:center; color:var(--muted); font-size:16px; flex:none;}

/* Empty */
.empty{text-align:center; color:var(--muted); padding:44px 20px; font-size:14px;}
.empty b{display:block; color:var(--text); font-size:15px; font-weight:700; margin-bottom:6px;}

/* Budget row */
.bud{background:var(--surface); border:.8px solid var(--border); border-radius:var(--r-ui); padding:14px 15px; margin-bottom:10px;}
.bud .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px;}
.bud .nm{font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:8px;}
.bud .fig{font-size:12.5px; color:var(--muted); font-weight:600;}
.bud .fig b{color:var(--text);}

/* Settings */
.list{background:var(--surface); border:.8px solid var(--border); border-radius:var(--r-card); overflow:hidden; margin-bottom:18px;}
.item{display:flex; align-items:center; gap:12px; padding:14px 16px; width:100%; text-align:left; border-bottom:.8px solid var(--border); background:none;}
.item:last-child{border-bottom:none;}
.item:active{background:var(--surface-2);}
.item .t{flex:1; font-size:14.5px; font-weight:600;}
.item .t small{display:block; font-weight:400; color:var(--muted); font-size:12px; margin-top:2px;}
.item .chev{color:var(--muted); font-size:16px;}
.item.danger .t{color:var(--neg);}
.foot{text-align:center; color:var(--muted); font-size:11.5px; line-height:1.6; padding:8px 20px 30px;}

/* FAB */
.fab{position:fixed; left:50%; bottom:calc(84px + var(--safe-bot) + 14px); transform:translateX(-50%); z-index:30; width:56px; height:56px; border-radius:50%; background:var(--brand); color:var(--on-brand); font-size:30px; font-weight:400; display:grid; place-items:center; border:.8px solid color-mix(in srgb, var(--brand) 70%, #000);}
.fab:active{filter:brightness(.94);}
#app:has(.screen[data-name="ajustes"].active) .fab{display:none;}
#app:has(.screen[data-name="orcamento"].active) .fab{display:none;}
#app:has(.screen[data-name="chat"].active) .fab{display:none;}
#app:has(.screen[data-name="patrimonio"].active) .fab{display:none;}

/* Tab bar */
.tabbar{position:fixed; bottom:0; left:0; right:0; z-index:25; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:saturate(160%) blur(16px); -webkit-backdrop-filter:saturate(160%) blur(16px); border-top:.8px solid var(--border); display:flex; padding:8px 8px calc(8px + var(--safe-bot)); max-width:520px; margin:0 auto;}
.tab{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 1px; color:var(--muted); font-size:9.5px; font-weight:600; letter-spacing:0; white-space:nowrap;}
.tab svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.tab.active{color:var(--brand);}

/* Sheet / modal */
.sheet-bg{position:fixed; inset:0; z-index:50; background:rgba(10,16,24,.42); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .22s ease;}
.sheet-bg.on{opacity:1; pointer-events:auto;}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:51; background:var(--surface); border-top-left-radius:18px; border-top-right-radius:18px; border-top:.8px solid var(--border); max-width:520px; margin:0 auto; transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1); max-height:92vh; overflow-y:auto; padding-bottom:calc(20px + var(--safe-bot));}
.sheet.on{transform:translateY(0);}
.sheet .grip{width:38px; height:4px; border-radius:999px; background:var(--border); margin:9px auto 4px;}
.sheet .sh-head{display:flex; align-items:center; justify-content:space-between; padding:6px 18px 12px;}
.sheet .sh-head h2{margin:0; font-size:17px; font-weight:700;}
.sheet .sh-head button{font-size:14px; font-weight:600; color:var(--brand); padding:6px;}
.sheet .body{padding:4px 18px 8px;}

/* Form */
.seg{display:flex; background:var(--surface-2); border-radius:var(--r-ui); padding:4px; gap:4px; margin-bottom:18px;}
.seg button{flex:1; padding:10px; border-radius:var(--r-step); font-size:14px; font-weight:600; color:var(--muted);}
.seg button.on{background:var(--surface); color:var(--text); border:.8px solid var(--border);}
.seg button.on[data-v="expense"]{color:var(--neg);}
.seg button.on[data-v="income"]{color:var(--pos);}

.amount-in{text-align:center; margin:6px 0 20px;}
.amount-in .cur{font-size:16px; font-weight:600; color:var(--muted); vertical-align:middle;}
.amount-in input{border:none; background:none; text-align:center; font-size:40px; font-weight:700; letter-spacing:-.02em; width:78%; color:var(--text); padding:0; outline:none;}
.amount-in input:focus{outline:none;}

.field{margin-bottom:16px;}
.field > label{display:block; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
.field input[type=text],.field input[type=date],.field input[type=number],.field select{width:100%; padding:13px 14px; border:.8px solid var(--border); border-radius:var(--r-ui); background:var(--surface); color:var(--text); outline:none; -webkit-appearance:none; appearance:none;}
.field input:focus,.field select:focus{border-color:var(--brand); box-shadow:var(--focus);}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{padding:9px 13px; border:.8px solid var(--border); border-radius:999px; font-size:13px; font-weight:600; color:var(--text); background:var(--surface); display:flex; align-items:center; gap:7px;}
.chip.on{border-color:var(--brand); background:color-mix(in srgb, var(--brand) 8%, var(--surface));}
.chip .dot{width:9px; height:9px;}

.btn{width:100%; padding:15px; border-radius:var(--r-ui); background:var(--brand); color:var(--on-brand); font-size:15px; font-weight:700; margin-top:6px; letter-spacing:.01em;}
.btn:active{filter:brightness(.94);}
.btn.ghost{background:none; color:var(--neg); border:.8px solid var(--border); margin-top:10px;}
.btn.sec{background:var(--surface-2); color:var(--text); border:.8px solid var(--border);}

.color-grid{display:flex; flex-wrap:wrap; gap:10px;}
.color-grid button{width:34px; height:34px; border-radius:50%; border:.8px solid var(--border);}
.color-grid button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand);}

.cat-manage{display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:.8px solid var(--border);}
.cat-manage:last-of-type{border-bottom:none;}
.cat-manage .nm{flex:1; font-size:14px; font-weight:600;}
.cat-manage .x{color:var(--muted); font-size:15px; padding:6px;}

/* Chat de lançamento */
.chat-log{display:flex; flex-direction:column; gap:9px; padding-top:6px; padding-bottom:64px;}
.msg{max-width:84%; padding:10px 13px; border-radius:15px; font-size:14px; line-height:1.4; border:.8px solid var(--border); word-wrap:break-word;}
.msg.me{align-self:flex-end; background:var(--brand); color:var(--on-brand); border-color:transparent; border-bottom-right-radius:5px;}
.msg.bot{align-self:flex-start; background:var(--surface); border-bottom-left-radius:5px;}
.msg .undo{color:var(--neg); font-weight:600; font-size:12.5px; display:inline-block; margin-top:5px;}
.chat-empty{color:var(--muted); font-size:13.5px; text-align:center; line-height:1.9; padding:30px 14px;}
#chatBar{position:fixed; left:0; right:0; bottom:calc(58px + var(--safe-bot)); z-index:24; max-width:520px; margin:0 auto; display:none; gap:8px; padding:10px 14px; background:color-mix(in srgb,var(--bg) 90%, transparent); backdrop-filter:saturate(160%) blur(14px); -webkit-backdrop-filter:saturate(160%) blur(14px); border-top:.8px solid var(--border);}
#app:has(.screen[data-name="chat"].active) #chatBar{display:flex;}
#chatBar input{flex:1; padding:12px 14px; border:.8px solid var(--border); border-radius:999px; background:var(--surface); color:var(--text); outline:none;}
#chatBar input:focus{border-color:var(--brand); box-shadow:var(--focus);}
#chatBar button{width:46px; height:46px; border-radius:50%; background:var(--brand); color:var(--on-brand); font-size:19px; flex:none; display:grid; place-items:center;}

/* Toast / alerta de meta */
.toast{position:fixed; left:50%; top:calc(var(--safe-top) + 12px); transform:translate(-50%,-150%); z-index:80; max-width:456px; width:calc(100% - 32px); background:var(--surface); color:var(--text); border:.8px solid var(--border); border-left:3px solid var(--warn); border-radius:var(--r-ui); padding:12px 15px; font-size:13.5px; font-weight:600; line-height:1.35; transition:transform .32s cubic-bezier(.32,.72,0,1);}
.toast.on{transform:translate(-50%,0);}
.toast.over{border-left-color:var(--neg);}
@media (prefers-reduced-motion:reduce){.toast{transition:none;}}

/* Importar fatura */
.imp-drop{border:.8px dashed var(--border); border-radius:var(--r-card); padding:26px 18px; text-align:center; color:var(--muted); font-size:13.5px; background:var(--surface-2);}
.imp-loading{display:flex; flex-direction:column; align-items:center; gap:14px; padding:40px 18px; color:var(--muted); font-size:14px;}
.spin{width:30px; height:30px; border:2.5px solid var(--border); border-top-color:var(--brand); border-radius:50%; animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;}}
.imp-summary{background:var(--brand); color:var(--on-brand); border-radius:var(--r-card); padding:14px 16px; margin-bottom:12px;}
.imp-summary .b{font-size:12px; opacity:.78; font-weight:600; letter-spacing:.04em;}
.imp-summary .t{font-size:22px; font-weight:700; margin-top:2px; letter-spacing:-.01em;}
.imp-tools{display:flex; gap:10px; align-items:center; margin-bottom:8px; font-size:12.5px; color:var(--muted);}
.imp-tools button{font-size:12.5px; font-weight:600; color:var(--brand); padding:4px 2px;}
.imp-tools .count{margin-left:auto; font-weight:600;}
.imp-row{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:.8px solid var(--border);}
.imp-row.off{opacity:.4;}
.imp-row .cb{width:22px; height:22px; border-radius:6px; border:.8px solid var(--border); flex:none; display:grid; place-items:center; background:var(--surface); color:var(--on-brand); font-size:13px; font-weight:700;}
.imp-row.on .cb{background:var(--brand); border-color:var(--brand);}
.imp-row .mid{flex:1; min-width:0;}
.imp-row .nm{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.imp-row .sub{display:flex; align-items:center; gap:6px; margin-top:3px;}
.imp-row select{font-size:11.5px; font-weight:600; color:var(--text); background:var(--surface-2); border:.8px solid var(--border); border-radius:6px; padding:3px 6px; max-width:150px; -webkit-appearance:none; appearance:none;}
.imp-row .dt{font-size:11px; color:var(--muted);}
.imp-row .amt{font-size:14px; font-weight:700; text-align:right; white-space:nowrap;}
.tag-parc{font-size:9.5px; font-weight:700; color:var(--muted); border:.8px solid var(--border); border-radius:999px; padding:1px 6px;}

/* Tela de bloqueio */
#lockScreen{position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:calc(var(--safe-top) + 20px) 24px calc(var(--safe-bot) + 20px);}
.lock-inner{width:100%; max-width:300px; text-align:center;}
.lock-mark{width:52px; height:52px; border-radius:15px; background:var(--brand); color:var(--on-brand); display:grid; place-items:center; margin:0 auto 16px; font-size:22px;}
.lock-title{font-size:18px; font-weight:700;}
.lock-sub{font-size:13px; color:var(--muted); margin-top:6px;}
.lock-dots{display:flex; gap:18px; justify-content:center; margin:28px 0 34px;}
.lock-dots i{width:14px; height:14px; border-radius:50%; border:1.4px solid var(--muted); transition:background .1s;}
.lock-dots i.on{background:var(--brand); border-color:var(--brand);}
.lock-dots.err i{border-color:var(--neg);}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.lock-dots.err{animation:shk .4s;}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:280px; margin:0 auto;}
.keypad button{width:66px; height:66px; justify-self:center; border-radius:50%; background:var(--surface); border:.8px solid var(--border); color:var(--text); font-size:24px; font-weight:600;}
.keypad button:active{background:var(--surface-2);}
.keypad .k-face,.keypad .k-del{background:none; border:none; color:var(--brand); font-size:15px; font-weight:600;}
.keypad .k-blank{visibility:hidden;}

/* Insights (Início) */
.insight{background:var(--surface); border:.8px solid var(--border); border-left:3px solid var(--brand); border-radius:var(--r-ui); padding:11px 14px; margin-bottom:8px; font-size:13.5px; font-weight:600; line-height:1.4; color:var(--text);}
.insight.ins-warn{border-left-color:var(--warn);}
.insight.ins-good{border-left-color:var(--pos);}

.hidden{display:none!important;}
</style>

<script>
(function(){
"use strict";
const KEY='financas_pessoais_v1';
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTHS_SHORT=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WEEK=['dom','seg','ter','qua','qui','sex','sáb'];
const PALETTE=['#003662','#3B7BB0','#4A90A4','#2E9E8F','#1E8E5A','#D1A02E','#E8804A','#C05A6E','#8A6FB0','#7A8794'];
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmt=c=>BRL.format((c||0)/100);
const fmtShort=c=>{const v=(c||0)/100; return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function defaults(){
  return {
    categories:[
      {id:'c_food',name:'Alimentação',color:'#E8804A',type:'expense'},
      {id:'c_market',name:'Mercado',color:'#4A90A4',type:'expense'},
      {id:'c_transp',name:'Transporte',color:'#3B7BB0',type:'expense'},
      {id:'c_home',name:'Moradia',color:'#8A6FB0',type:'expense'},
      {id:'c_health',name:'Saúde',color:'#C05A6E',type:'expense'},
      {id:'c_fun',name:'Lazer',color:'#D1A02E',type:'expense'},
      {id:'c_edu',name:'Educação',color:'#2E9E8F',type:'expense'},
      {id:'c_sub',name:'Assinaturas',color:'#7A8794',type:'expense'},
      {id:'c_other',name:'Outros',color:'#6A7686',type:'expense'},
      {id:'c_aporte',name:'Investimento',color:'#28CC95',type:'expense'},
      {id:'c_salary',name:'Salário',color:'#1E8E5A',type:'income'},
      {id:'c_invest',name:'Investimentos',color:'#3B7BB0',type:'income'},
      {id:'c_extra',name:'Extra',color:'#2E9E8F',type:'income'}
    ],
    transactions:[],
    bills:[],
    budgets:{},
    alerted:{},
    chat:[],
    settings:{},
    patrimonio:[]
  };
}
let db;
try{ db=JSON.parse(localStorage.getItem(KEY)); }catch(e){ db=null; }
if(!db||!db.categories){ db=defaults(); }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){ alert('Não foi possível salvar. O armazenamento do navegador pode estar cheio ou bloqueado.'); } }

// state
const now=new Date();
let curY=now.getFullYear(), curM=now.getMonth(); // 0-11
let activeTab='inicio';
let homeFilter=null; // categoria filtrada na tela Início (ou null)
let patrFilter=null; // classe de ativo filtrada no Patrimônio (ou null)

const $=s=>document.querySelector(s);
const catById=id=>db.categories.find(c=>c.id===id);
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ymOf(){return curY+'-'+String(curM+1).padStart(2,'0');}
function txInMonth(){const ym=ymOf(); return db.transactions.filter(t=>t.date.slice(0,7)===ym);}

function monthTotals(){
  let inc=0,exp=0;
  txInMonth().forEach(t=>{ if(t.type==='income') inc+=t.amount; else exp+=t.amount; });
  return {inc,exp,bal:inc-exp};
}

/* ---------- RENDER ---------- */
function renderMonthLabel(){ $('#monthLbl').textContent=MONTHS[curM]+' '+curY; }

function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function initials(name){return (name||'?').trim().slice(0,1).toUpperCase();}

function insights(){
  const exp=txInMonth().filter(t=>t.type==='expense' && t.categoryId!=='c_aporte');
  const out=[];
  if(exp.length<3) return out;
  const total=exp.reduce((s,t)=>s+t.amount,0);
  // cobrança repetida: mesmo valor (>=R$20) e mesmo nome normalizado
  outer: for(let i=0;i<exp.length;i++){ for(let j=i+1;j<exp.length;j++){
    if(exp[i].amount===exp[j].amount && exp[i].amount>=2000 && exp[i].note && NORM(exp[i].note)===NORM(exp[j].note)){
      out.push({level:'warn', text:`Possível cobrança repetida: ${esc(exp[i].note)} de <span class="tnum">${fmt(exp[i].amount)}</span> apareceu 2 vezes.`}); break outer;
    }
  }}
  // assinaturas
  const subs=exp.filter(t=>t.categoryId==='c_sub'); const subTot=subs.reduce((s,t)=>s+t.amount,0);
  if(subTot>0 && subs.length>=2) out.push({level:'info', text:`Suas assinaturas somam <span class="tnum">${fmt(subTot)}</span> este mês, em ${subs.length} cobranças.`});
  // concentração
  const byCat={}; exp.forEach(t=>byCat[t.categoryId]=(byCat[t.categoryId]||0)+t.amount);
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  if(top && total>0){ const pct=Math.round(top[1]/total*100); if(pct>=35){ const c=catById(top[0])||{name:'essa categoria'}; out.push({level:'info', text:`${pct}% dos seus gastos foram em ${esc(c.name)}.`}); } }
  // comer fora vs mercado
  const fora=byCat['c_food']||0, merc=byCat['c_market']||0;
  if(fora>0 && merc>0){ const pct=Math.round(fora/(fora+merc)*100); if(pct>=65) out.push({level:'info', text:`${pct}% da sua alimentação foi fora de casa.`}); }
  return out.slice(0,3);
}
function renderInicio(){
  const t=monthTotals();
  const list=txInMonth().slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:(b._o||0)-(a._o||0));
  // category breakdown (expenses)
  const byCat={};
  txInMonth().forEach(x=>{ if(x.type==='expense' && x.categoryId!=='c_aporte'){ byCat[x.categoryId]=(byCat[x.categoryId]||0)+x.amount; }});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxCat=cats.length?cats[0][1]:1;

  let html=`
    <div class="hero">
      <div class="lbl">Saldo do mês</div>
      <div class="val tnum">${fmt(t.bal)}</div>
      <div class="sub">${list.length} lançamento${list.length===1?'':'s'} em ${MONTHS[curM].toLowerCase()}</div>
    </div>
    <div class="tiles">
      <div class="tile pos"><div class="lbl">Entrou</div><div class="v tnum">${fmt(t.inc)}</div></div>
      <div class="tile neg"><div class="lbl">Saiu</div><div class="v tnum">${fmt(t.exp)}</div></div>
    </div>`;

  const ins=insights();
  if(ins.length){ html+=`<div class="sec-title">Insights</div>`; ins.forEach(x=>{ html+=`<div class="insight ins-${x.level}">${x.text}</div>`; }); }

  if(list.length>5) html+=`<input id="txSearch" class="tx-search" placeholder="Buscar lançamento" autocomplete="off">`;

    html+=`<div class="empty">${homeFilter?'<b>Nada aqui neste mês</b>Sem lançamentos de '+esc(fcat.name)+'.':'<b>Nenhum lançamento ainda</b>Toque no botão + para registrar seu primeiro gasto ou receita deste mês.'}</div>`;
  }else{
    let lastDay='';
    shown.forEach(x=>{
      if(x.date!==lastDay){
        lastDay=x.date;
        html+=`<div class="day-head">${dayLabel(x.date)}</div>`;
      }
      const c=catById(x.categoryId)||{name:'Sem categoria',color:'#6A7686'};

function dayLabel(dstr){
  const t=localDate(now), y=localDate(new Date(now.getTime()-86400000));
  if(dstr===t) return 'Hoje';
  if(dstr===y) return 'Ontem';
  const [Y,M,D]=dstr.split('-').map(Number);
  const d=new Date(Y,M-1,D);
  return WEEK[d.getDay()]+', '+D+' '+MONTHS_SHORT[M-1];
}

function billStatus(b){
  const ym=ymOf();
  const paid=(b.paidMonths||[]).includes(ym);
  if(paid) return 'ok';
  // late if this month is current month and dueDay passed, or month already ended
  const isCurrent=(curY===now.getFullYear()&&curM===now.getMonth());
  const isPast=(curY<now.getFullYear())||(curY===now.getFullYear()&&curM<now.getMonth());
  if(isPast) return 'late';
  if(isCurrent && now.getDate()>b.dueDay) return 'late';
  return 'open';
}

// casa PALAVRA INTEIRA (evita "gas" dentro de "gastei", "no" dentro de "novo", etc.)
function chatHint(t){
  for(const [ws,id] of CHAT_HINTS){
    for(const w of ws){
      const nw=NORM(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      if(new RegExp('\\b'+nw+'\\b').test(t)) return catById(id)?id:null;
    }
  }
  return null;
}
function nomeChat(d){ const p=d.split(/\s+/).filter(x=>x.length>1).slice(0,5); const s=p.join(' ').trim(); return s? s.charAt(0).toUpperCase()+s.slice(1) : ''; }
function parseChatEntry(text){
  const t=NORM(text);
  const isIncome=['recebi','ganhei','entrou','recebimento','recebido','caiu','salario','pix recebido'].some(w=>t.includes(w));
  const m=t.match(/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/);
  if(!m) return null;
  const num=m[1];
  let val;
  if(/\.\d{3}/.test(num) || (num.includes(',')&&num.includes('.'))) val=parseFloat(num.replace(/\./g,'').replace(',','.'));
  else val=parseFloat(num.replace(',','.'));
  if(isNaN(val)||val<=0) return null;
  const cents=Math.round(val*100);
  let date=localDate(now);
  if(/\bontem\b/.test(t)) date=localDate(new Date(now.getTime()-86400000));
  let desc=text.replace(m[0],' ').replace(/r\$/ig,' ');
  desc=desc.replace(/\b(gastei|gasto|gastar|paguei|pagar|comprei|comprar|recebi|ganhei|entrou|recebimento|recebido|reais|real|hoje|ontem|de|do|da|no|na|em|com|por|pra|para|um|uma|uns|umas|mais)\b/ig,' ');
  desc=desc.replace(/\s+/g,' ').trim();
  let catId;
  if(isIncome){ catId=(t.includes('salario')&&catById('c_salary'))?'c_salary':(db.categories.find(c=>c.type==='income')||{}).id; }
  else { catId=sherlockCat(desc)||chatHint(t)||appCatFor(desc||t); }
  const name=nomeChat(desc)||(catById(catId)||{name:'Lançamento'}).name;
  return {type:isIncome?'income':'expense', cents, catId, date, name};
}
function appendMsg(role,text,txId){
  const log=$('#chatLog'); if(!log) return;
  const d=document.createElement('div'); d.className='msg '+role; d.textContent=text;
  if(txId){ d.appendChild(document.createElement('br')); const u=document.createElement('a'); u.className='undo'; u.textContent='Desfazer'; u.dataset.undo=txId; d.appendChild(u); }
  log.appendChild(d);
}
function scrollChat(){ const log=$('#chatLog'); if(log) requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight)); }
function chatSend(){
  const inp=$('#chatIn'); if(!inp) return; const text=inp.value.trim(); if(!text) return;
  db.chat=db.chat||[];
  db.chat.push({role:'me',text}); appendMsg('me',text);
  const p=parseChatEntry(text);
  if(!p){
    const r='Não peguei o valor. Tente algo como "gastei 50 no almoço", "uber 25" ou "recebi 3000 de salário".';
    db.chat.push({role:'bot',text:r}); appendMsg('bot',r);
  }else{
    const tx={id:uid(),type:p.type,amount:p.cents,categoryId:p.catId,date:p.date,note:p.name,_o:Date.now(),_chat:1};
    db.transactions.push(tx);
    const c=catById(p.catId)||{name:'Outros'};
    const quando = p.date!==localDate(now)? ' · '+dayLabel(p.date) : '';
    const r=`${p.type==='income'?'Recebimento':'Gasto'} registrado: ${p.name} · ${c.name} · ${fmt(p.cents)}${quando}`;
    db.chat.push({role:'bot',text:r,txId:tx.id}); appendMsg('bot',r,tx.id);
    const [Y,M]=p.date.split('-').map(Number); curY=Y; curM=M-1;
    if(p.type==='expense'){ checkGoals(p.catId); pushSync(); }
  }
  if(db.chat.length>80) db.chat=db.chat.slice(-80);
  save(); inp.value=''; inp.focus(); scrollChat();
}
function renderChat(){
  db.chat=db.chat||[];
  let inner;
  if(!db.chat.length){
    inner=`<div class="chat-empty"><b style="color:var(--text);display:block;margin-bottom:8px;font-size:15px">Registre gastos conversando</b>Escreva como você fala:<br>"gastei 50 no almoço"<br>"uber 25"<br>"mercado 320,50 ontem"<br>"recebi 3000 de salário"</div>`;

/* ================= PATRIMÔNIO ================= */
const PATR_CLASSES=[
  {id:'investimentos', nome:'Investimentos', cor:'#28CC95', passivo:false},
  {id:'previdencia',   nome:'Previdência',   cor:'#3E7CB1', passivo:false},
  {id:'reserva',       nome:'Reserva',       cor:'#4A90A4', passivo:false},
  {id:'imovel',        nome:'Imóvel',        cor:'#D1A02E', passivo:false},
  {id:'cripto',        nome:'Cripto',        cor:'#E8804A', passivo:false},
  {id:'divida',        nome:'Dívida',        cor:'#FF5C6C', passivo:true},
];
const patrClass=id=>PATR_CLASSES.find(c=>c.id===id)||PATR_CLASSES[0];
function donut(classes, total, size){
  const r=size/2-9, C=2*Math.PI*r, cx=size/2, cy=size/2; let off=0, segs='';
  classes.forEach(([cid,val])=>{ const c=patrClass(cid); const len=(total>0?val/total:0)*C;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c.cor}" stroke-width="10" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=len; });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/>${segs}</svg>`;
}

function patrRow(i){
  const c=patrClass(i.classe); const neg=c.passivo;
  const r=(i.rentab!=null && i.rentab!=='' && !isNaN(i.rentab))?Number(i.rentab):null;
  const rline = r!==null ? `<span class="rentab ${r>=0?'up':'down'}">${r>=0?'▲':'▼'} ${Math.abs(r).toFixed(2).replace('.',',')}%</span>` : '';

/* ---------- ALERTAS DE META ---------- */
function toast(msg, level){
  const t=document.createElement('div'); t.className='toast '+(level||''); t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('on'));
  setTimeout(()=>{ t.classList.remove('on'); setTimeout(()=>t.remove(),340); }, 4600);
}
function notifyGoal(msg, over){
  toast(msg, over?'over':'warn');
  try{ if('Notification' in window && Notification.permission==='granted') new Notification('Meta de gasto', {body:msg, icon:'./icon-192.png'}); }catch(e){}
}
// Confere metas das categorias afetadas e avisa ao cruzar 50/75/100% (uma vez por faixa por mês)
function checkGoals(catIds){
  db.alerted=db.alerted||{};
  const ids=Array.isArray(catIds)?catIds:[catIds]; const seen=new Set();
  ids.forEach(catId=>{
    if(!catId||seen.has(catId)) return; seen.add(catId);
    const bud=db.budgets[catId]; if(!bud) return;
    let spent=0; txInMonth().forEach(t=>{ if(t.type==='expense'&&t.categoryId===catId) spent+=t.amount; });
    const pct=spent/bud*100;
    let crossed=0; if(pct>=100) crossed=100; else if(pct>=75) crossed=75; else if(pct>=50) crossed=50;
    const key=ymOf()+':'+catId; const already=db.alerted[key]||0;
    if(crossed>already){
      const c=catById(catId)||{name:'categoria'};
      const msg = crossed>=100 ? `Meta estourada: ${c.name} está em ${fmt(spent)} de ${fmt(bud)}.` : `${crossed}% da meta de ${c.name}: ${fmt(spent)} de ${fmt(bud)}.`;
      notifyGoal(msg, crossed>=100);
    }
    db.alerted[key]=crossed;
  });
  save();
}

/* ---------- PUSH (alerta com app fechado) ---------- */
const VAPID_PUBLIC='BMYBTCx7INlsh0w2Z574OYcycvrgcvB1f9UiY2GPcrBlnFQVfA19BnC0sKBliFKHN0TByc5TeKzMm51zhlFMLOc';
function urlB64ToUint8(base64){
  const pad='='.repeat((4-base64.length%4)%4);
  const b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
function buildSnapshot(){
  const ry=now.getFullYear(), rm=now.getMonth()+1;
  const ym=ry+'-'+String(rm).padStart(2,'0'); const cats={};
  Object.keys(db.budgets||{}).forEach(cid=>{
    if(db.budgets[cid]>0){ const c=catById(cid); if(!c) return;
      let spent=0; db.transactions.forEach(t=>{ if(t.type==='expense'&&t.categoryId===cid && t.date.slice(0,7)===ym) spent+=t.amount; });
      cats[cid]={name:c.name,budget:db.budgets[cid],spent};
    }
  });
  return {ym,cats};
}
async function pushSync(){
  const s=db.settings||{};
  if(!s.pushOn||!s.pushServer||!s.pushSub) return false;
  try{ const r=await fetch(s.pushServer+'/api/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:s.clientId,subscription:s.pushSub,snapshot:buildSnapshot()})}); return r.ok; }
  catch(e){ return false; }
}
async function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){ toast('Este aparelho não suporta. Instale o app na Tela de Início primeiro.'); return; }
  db.settings=db.settings||{};
  const entered=prompt('Cole o endereço do servidor (Vercel):', db.settings.pushServer||'https://minhas-financas-push.vercel.app');
  if(entered===null) return;
  const server=entered.trim().replace(/\/+$/,'');
  if(!/^https:\/\/.+/.test(server)){ toast('Endereço inválido. Deve começar com https://'); return; }
  db.settings.pushServer=server;
  let perm;
  try{ perm=await Notification.requestPermission(); }catch(e){ perm='denied'; }
  if(perm!=='granted'){ toast('Permissão de notificação negada.'); save(); renderAll(); return; }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64ToUint8(VAPID_PUBLIC)});
    db.settings.clientId=db.settings.clientId||(uid()+uid());
    db.settings.pushSub=sub.toJSON(); db.settings.pushOn=true; save();
    const ok=await pushSync();
    toast(ok?'Alertas com o app fechado ativados.':'Ativado no app, mas o servidor não respondeu. Confira o endereço.');
  }catch(e){ toast('Não deu pra ativar: '+(e.message||e)); }
  renderAll();
}

/* ---------- BLOQUEIO (PIN / Face ID) ---------- */
async function sha256(s){ const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fin:'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
let lockBuf='';
function paintDots(err){ const dots=$('#lockDots'); dots.classList.toggle('err',!!err); [...dots.children].forEach((d,i)=>d.classList.toggle('on', i<lockBuf.length)); }
function buildKeypad(){
  const face=(db.settings&&db.settings.faceCred)?`<button class="k-face" data-k="face">Face ID</button>`:`<span class="k-blank"></span>`;
  const cells=['1','2','3','4','5','6','7','8','9',face,'0',`<button class="k-del" data-k="del">⌫</button>`];
  $('#keypad').innerHTML=cells.map(c=>/^\d$/.test(c)?`<button data-k="${c}">${c}</button>`:c).join('');
}
function showLock(){ buildKeypad(); lockBuf=''; paintDots(); $('#lockSub').textContent=(db.settings&&db.settings.faceCred)?'Digite o PIN ou use o Face ID':'Digite seu PIN'; $('#lockScreen').classList.remove('hidden'); if(db.settings&&db.settings.faceCred) setTimeout(faceUnlock,400); }
function unlockApp(){ $('#lockScreen').classList.add('hidden'); }
async function pinDigit(d){ if(lockBuf.length>=4) return; lockBuf+=d; paintDots(); if(lockBuf.length===4){ const h=await sha256(lockBuf); if(h===(db.settings||{}).pinHash){ unlockApp(); } else { paintDots(true); setTimeout(()=>{ lockBuf=''; paintDots(); },450); } } }
function bufB64u(buf){ const a=new Uint8Array(buf); let s=''; a.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64uBuf(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); const pad='='.repeat((4-s.length%4)%4); const r=atob(s+pad); const a=new Uint8Array(r.length); for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i); return a.buffer; }
async function faceRegister(){
  if(!window.PublicKeyCredential){ toast('Face ID não suportado neste aparelho.'); return false; }
  try{ const c=await navigator.credentials.create({publicKey:{ challenge:crypto.getRandomValues(new Uint8Array(16)), rp:{name:'Minhas Finanças'}, user:{id:crypto.getRandomValues(new Uint8Array(8)),name:'gabriel',displayName:'Gabriel'}, pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}], authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'}, timeout:60000 }});
    db.settings=db.settings||{}; db.settings.faceCred=bufB64u(c.rawId); save(); return true;
  }catch(e){ toast('Não deu pra ativar o Face ID.'); return false; }
}
async function faceUnlock(){ const s=db.settings||{}; if(!s.faceCred) return; try{ await navigator.credentials.get({publicKey:{ challenge:crypto.getRandomValues(new Uint8Array(16)), allowCredentials:[{type:'public-key',id:b64uBuf(s.faceCred)}], userVerification:'required', timeout:60000 }}); unlockApp(); }catch(e){} }
function lockSheet(){
  const s=db.settings||{}; const on=!!s.pinHash;
  openSheet(`<div class="sh-head"><button id="shCancel">Fechar</button><h2>Bloqueio do app</h2><span></span></div><div class="body">${on?`<p style="color:var(--muted);font-size:13.5px;margin:0 0 18px">O app pede o PIN sempre que abrir. Seus dados continuam só neste aparelho.</p><div class="field" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px"><label style="text-transform:none;letter-spacing:0;font-size:14.5px;font-weight:600;margin:0">Desbloquear com Face ID</label><input type="checkbox" id="faceTgl" ${s.faceCred?'checked':''} style="width:22px;height:22px"></div><button class="btn sec" id="changePin">Trocar PIN</button><button class="btn ghost" id="removePin">Desativar bloqueio</button>`:`<p style="color:var(--muted);font-size:13.5px;margin:0 0 18px">Crie um PIN de 4 dígitos. O app pede ele ao abrir. Fica só neste aparelho, nunca vai pra internet.</p><div class="field"><label>Novo PIN (4 dígitos)</label><input type="password" id="newPin" inputmode="numeric" maxlength="4" placeholder="••••" style="letter-spacing:10px;text-align:center;font-size:22px"></div><button class="btn" id="savePin">Ativar bloqueio</button>`}</div>`);

/* Currency input helper: keeps cents */
function bindMoney(input, initialCents){
  let cents=initialCents||0;
  const paint=()=>{ input.value = cents? (cents/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : ''; };
  input.setAttribute('inputmode','numeric');
  input.addEventListener('input',()=>{ const digits=input.value.replace(/\D/g,'').slice(0,12); cents=digits?parseInt(digits,10):0; paint(); input.setSelectionRange(input.value.length,input.value.length); });
  paint();
  return ()=>cents;
}

// categoria do parser -> categoria do app
const MAP_TO_APP={"Restaurante":"c_food","Alimentação":"c_market","Farmácia":"c_health","Médico/Dentista":"c_health","Combustível":"c_transp","Transporte":"c_transp","Manutenção Veículos":"c_transp","Assinaturas":"c_sub","TV/Internet":"c_sub","Telefone":"c_sub","Esportes/Hobbies":"c_fun","Viagens":"c_fun","Clube":"c_fun","Cuidados com a Beleza":"c_other","Pet":"c_other","Educação":"c_edu","Empregados":"c_home","Diversas":"c_other","A Classificar":"c_other"};
const SKIP_KEYWORDS=["total desta fatura","total da fatura","total fatura","subtotal","pagamento efetuado","pagamento em ","saldo anterior","credito disponivel","limite de credito","vencimento","valor minimo","valor total","encargos","juros","iof","multa","fatura anterior","saldo devedor","= total","total ="];
function NORM(s){return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function deveIgnorar(desc){const d=NORM(desc); return SKIP_KEYWORDS.some(k=>d.includes(NORM(k)));}
function catFatura(desc){const d=NORM(desc); for(const cat in MAPA_CATEGORIAS){for(const kw of MAPA_CATEGORIAS[cat]){if(d.includes(NORM(kw))) return cat;}} return 'A Classificar';}
/* ===== SHERLOCK: aprende estabelecimento -> categoria das suas correções ===== */
// Extrai uma assinatura estável do estabelecimento: sem parcela, sem números, sem símbolos.
function sherlockKey(desc){
  let d=NORM(desc)
    .replace(/parcela\s+\d+\/\d+/g,' ')
    .replace(/\b\d{1,2}\/\d{2,3}\b/g,' ')
    .replace(/[*#•·]/g,' ')
    .replace(/\d+/g,' ')
    .replace(/[^a-z\s]/g,' ')
    .replace(/\s+/g,' ').trim();
  const STOP=new Set(['do','da','de','dos','das','no','na','em','os','as','ao','com','e']);
  const toks=d.split(' ').filter(w=>w.length>1 && !STOP.has(w));
  return toks.slice(0,3).join(' ');
}
function catMem(){ db.settings=db.settings||{}; db.settings.catMemory=db.settings.catMemory||{}; return db.settings.catMemory; }
function isExpenseCat(id){ const c=catById(id); return !!(c&&c.type==='expense'); }
function sherlockCat(desc){ const k=sherlockKey(desc); if(!k) return null; const id=catMem()[k]; return isExpenseCat(id)?id:null; }
function sherlockLearn(desc,catId){ const k=sherlockKey(desc); if(!k||!isExpenseCat(catId)) return; catMem()[k]=catId; }
function appCatFor(desc){const s=sherlockCat(desc); if(s) return s; const id=MAP_TO_APP[catFatura(desc)]||'c_other'; return catById(id)?id:(db.categories.find(c=>c.type==='expense')||{}).id;}
function parseValorCents(s){
  if(!s) return null;
  s=s.replace(/[R$\s]/g,'').trim();
  let v=null;
  if(/^\d{1,3}(\.\d{3})*,\d{2}$/.test(s)) v=parseFloat(s.replace(/\./g,'').replace(',','.'));
  else if(/^\d+,\d{2}$/.test(s)) v=parseFloat(s.replace(',','.'));
  else return null;
  if(isNaN(v)||v===0) return null;
  return Math.round(v*100);
}
function nomeLimpo(desc){
  let d=desc.replace(/\s*-?\s*parcela\s+\d+\/\d+\s*$/i,'');
  d=d.replace(/\b\d{1,2}\/\d{2,3}\b/g,'').replace(/\b\d{6,}\b/g,'').replace(/\s+[A-Z]{2}\s*$/,'').trim();
  const p=d.split(/\s+/).filter(x=>x.length>1 && x!=='-');
  const s=p.slice(0,5).join(' ').trim();
  return s? s.replace(/\S+/g,t=>t.charAt(0).toUpperCase()+t.slice(1).toLowerCase()) : desc.slice(0,40);
}
function detectBank(t){
  t=NORM(t);
  if(t.includes('nubank')||t.includes('nu pagamentos')) return 'nubank';
  if(t.includes('xp investimentos')||t.includes('xp cartao')||t.includes('xp credito')||t.includes('banco xp')||t.includes('cartao xp')) return 'xp';
  if(t.includes('itau')) return 'itau';
  if(t.includes('bradesco')) return 'bradesco';
  if(t.includes('santander')) return 'santander';
  return 'generico';
}
const MESES_NU={jan:'01',fev:'02',mar:'03',abr:'04',mai:'05',jun:'06',jul:'07',ago:'08',set:'09',out:'10',nov:'11',dez:'12'};
function inferYear(mm){ // mm '01'..'12' sem ano -> ano de referência
  const m=parseInt(mm,10), tM=now.getMonth()+1, tY=now.getFullYear();
  return m>tM+1 ? tY-1 : tY;
}
function parcelaTag(desc){const m=desc.match(/parcela\s+(\d+)\/(\d+)/i)||desc.match(/\b(\d{1,2})\/(\d{2,3})\b/); return m?`${m[1]}/${m[2]}`:'';}

function parseNubank(lines){
  const re=/^(\d{2})\s+(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\b(.+?)\s+R\$\s*(\d{1,3}(?:\.\d{3})*,\d{2})\s*$/i;
  const STOP=["pagamentos e financiamentos","proximas faturas","resumo da fatura","alternativas de pagamento","encargos e custo efetivo"];
  const SKIP=["transacoes de","pagamento em","estorno de","credito de rotativo","saldo em rotativo","juros de rotativo","iof de rotativo","encerramento de divida","parcelamento de fatura","total a pagar","fatura anterior","saldo financiado","outros lancamentos"];
  const out=[]; let stop=false;
  for(const raw of lines){
    const linha=raw.trim(); const ln=NORM(linha);
    if(STOP.some(s=>ln.includes(s))){stop=true; continue;}
    if(stop||!linha) continue;
    if(SKIP.some(s=>ln.includes(s))) continue;
    if(/[−–—]/.test(linha) || /-\s*R\$/.test(linha)) continue;
    const m=linha.match(re); if(!m) continue;
    const dia=m[1], mes=MESES_NU[m[2].toLowerCase()]||'01';
    const cents=parseValorCents(m[4]); if(!cents) continue;
    let desc=m[3].trim();
    desc=desc.replace(/^[•·•]+\s*\d{4}\s+/,'').replace(/^\d{4}\s+(?=\S)/,'').replace(/^nu\b\s*/i,'').replace(/^[•·•]+\s*/,'').trim();
    if(desc.length>1 && !deveIgnorar(desc)){
      const y=inferYear(mes);
      out.push({date:`${y}-${mes}-${dia}`,desc,cents});
    }
  }
  return out;
}
function parseXP(lines){
  const re=/^(\d{2}\/\d{2}\/\d{2,4})\s+(.+?)\s+(\d{1,3}(?:\.\d{3})*,\d{2})\s+0,00\s*$/;
  const STOP=["encargos da fatura","demais cobrancas","parcelamento de fatura"];
  const IGN=["subtotal","total","data","descricao","pagamentos validos","saldo financiado","fatura anterior"];
  const out=[]; let stop=false;
  for(const raw of lines){
    const linha=raw.trim(); const ln=NORM(linha);
    if(STOP.some(s=>ln.includes(s))) stop=true;
    if(stop) continue;
    const m=linha.match(re); if(!m) continue;
    const cents=parseValorCents(m[3]); if(!cents||cents<=0) continue;
    const desc=m[2].trim();
    if(IGN.some(k=>NORM(desc).includes(k))) continue;
    const p=m[1].split('/'); const y=p[2].length===2?('20'+p[2]):p[2];
    out.push({date:`${y}-${p[1]}-${p[0]}`,desc,cents});
  }
  return out;
}
function parseGenerico(lines){
  const re=/^(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\s+(.{3,60}?)\s+(\d{1,3}(?:\.\d{3})*,\d{2})\s*$/;
  const out=[];
  for(const raw of lines){
    const linha=raw.trim(); if(!linha||deveIgnorar(linha)) continue;
    const m=linha.match(re); if(!m) continue;
    const cents=parseValorCents(m[5]); if(!cents) continue;
    const dd=m[1],mm=m[2]; const y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):String(inferYear(mm));
    out.push({date:`${y}-${mm}-${dd}`,desc:m[4].trim(),cents});
  }
  return out;
}

async function extractLines(file){
  const pdfjs=await import('./vendor/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc='./vendor/pdf.worker.min.mjs';
  const buf=await file.arrayBuffer();
  const doc=await pdfjs.getDocument({data:buf}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p);
    const tc=await page.getTextContent();
    const rows={};
    tc.items.forEach(it=>{ if(it.str===undefined) return; const y=Math.round(it.transform[5]); (rows[y]=rows[y]||[]).push(it); });
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const items=rows[y].sort((a,b)=>a.transform[4]-b.transform[4]);
      let line='',prevEnd=null;
      items.forEach(it=>{ const x=it.transform[4]; if(prevEnd!==null && x-prevEnd>1.5) line+=' '; line+=it.str; prevEnd=x+(it.width||0); });
      lines.push(line.replace(/\s+/g,' ').trim());
    });
  }
  return lines;
}

async function importFatura(file){
  openSheet(`<div class="sh-head"><button id="shCancel">Cancelar</button><h2>Lendo fatura</h2><span></span></div><div class="body"><div class="imp-loading"><div class="spin"></div><div>Lendo o PDF no seu aparelho...<br><span style="font-size:12px;opacity:.8">Nada é enviado para a internet.</span></div></div></div>`);
  sheetContent.querySelector('#shCancel').addEventListener('click',closeSheet);
  try{
    const lines=await extractLines(file);
    const banco=detectBank(lines.join('\n'));
    let raw = banco==='nubank'?parseNubank(lines) : banco==='xp'?parseXP(lines) : parseGenerico(lines);
    if(!raw.length && banco!=='generico') raw=parseGenerico(lines);
    const items=raw.map(t=>{const c=appCatFor(t.desc); return {date:t.date, name:nomeLimpo(t.desc), rawDesc:t.desc, cents:t.cents, cat:c, auto:c, parc:parcelaTag(t.desc), on:true};});
    reviewFatura(banco, items);

    openSheet(`<div class="sh-head"><button id="shCancel">Fechar</button><h2>Não deu certo</h2><span></span></div><div class="body"><p style="color:var(--muted);font-size:14px">Não consegui ler esse PDF. Pode ser uma fatura protegida por senha ou digitalizada como imagem. Tente o PDF original do banco (XP ou Nubank).</p><p style="color:var(--muted);font-size:12px">Detalhe técnico: ${esc(String(e.message||e))}</p></div>`);
    sheetContent.querySelector('#shCancel').addEventListener('click',closeSheet);
  }
}

const BANK_LABEL={nubank:'Nubank',xp:'XP',itau:'Itaú',bradesco:'Bradesco',santander:'Santander',generico:'cartão'};
function reviewFatura(banco, items){

    sheetContent.querySelector('#shCancel').addEventListener('click',closeSheet); return;
  }
  const expCats=db.categories.filter(c=>c.type==='expense');
  const draw=()=>{

    const total=on.reduce((s,i)=>s+i.cents,0);
    const rows=items.map((i,idx)=>`

            <select data-cat="${idx}">${expCats.map(c=>`<option value="${c.id}" ${c.id===i.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select>

        <div class="amt tnum">${fmt(i.cents)}</div>
      </div>`).join('');
    openSheet(`
      <div class="sh-head"><button id="shCancel">Cancelar</button><h2>Revisar fatura</h2><span></span></div>
      <div class="body">
        <div class="imp-summary"><div class="b">Fatura ${esc(BANK_LABEL[banco]||'cartão')}</div><div class="t tnum">${fmt(total)}</div></div>
        <div class="imp-tools"><button id="selAll">Todas</button><button id="selNone">Nenhuma</button><span class="count">${on.length} de ${items.length}</span></div>
        ${rows}
        <button class="btn" id="impDo" style="margin-top:16px">Adicionar ${on.length} lançamento${on.length===1?'':'s'}</button>
        <p style="color:var(--muted);font-size:11.5px;text-align:center;margin-top:10px">Lançamentos repetidos (mesma data, valor e nome) são ignorados automaticamente.</p>
      </div>`);
    sheetContent.querySelector('#shCancel').addEventListener('click',closeSheet);
    sheetContent.querySelector('#selAll').addEventListener('click',()=>{items.forEach(i=>i.on=true);draw();});
    sheetContent.querySelector('#selNone').addEventListener('click',()=>{items.forEach(i=>i.on=false);draw();});
    sheetContent.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.toggle; items[i].on=!items[i].on; draw();}));
    sheetContent.querySelectorAll('[data-cat]').forEach(s=>s.addEventListener('change',()=>{items[+s.dataset.cat].cat=s.value;}));
    sheetContent.querySelector('#impDo').addEventListener('click',()=>{
      const chosen=items.filter(i=>i.on);
      if(!chosen.length){ alert('Selecione ao menos um lançamento.'); return; }
      const existing=new Set(db.transactions.map(t=>t.date+'|'+t.amount+'|'+NORM(t.note||'').slice(0,20)));
      let add=0, dup=0, lastDate=null;
      chosen.forEach(i=>{
        const key=i.date+'|'+i.cents+'|'+NORM(i.name).slice(0,20);
        if(existing.has(key)){ dup++; return; }
        existing.add(key);
        db.transactions.push({id:uid(),type:'expense',amount:i.cents,categoryId:i.cat,date:i.date,note:i.name,_o:Date.now(),_fatura:banco});
        add++; lastDate=i.date;
      });
      chosen.forEach(i=>{ if(i.cat!==i.auto) sherlockLearn(i.rawDesc,i.cat); });
      save(); closeSheet();
      if(lastDate){ const [Y,M]=lastDate.split('-').map(Number); curY=Y; curM=M-1; }
      renderAll();
      checkGoals([...new Set(chosen.map(i=>i.cat))]); pushSync();
      alert(add+' lançamento'+(add===1?'':'s')+' adicionado'+(add===1?'':'s')+(dup?'. '+dup+' já existia'+(dup===1?'':'m')+' e foram ignorados.':'.'));
    });
  };
  draw();
}

/* ================= IMPORTAR EXTRATO (OFX / CSV) — Nubank, XP ================= */
function normDate(s){
  s=(s||'').trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  let m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  m=s.match(/^(\d{2})\/(\d{2})\/(\d{2})$/); if(m) return `20${m[3]}-${m[2]}-${m[1]}`;
  return localDate(now);
}
function moneyToCents(raw){
  if(raw==null) return null;
  let s=String(raw).trim(); const neg=/^-|-\s*$/.test(s)||/^\(.*\)$/.test(s);
  s=s.replace(/[^\d.,]/g,'');
  if(s.includes(',')&&s.includes('.')){ if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(s.includes(',')) s=s.replace(',','.');
  const v=parseFloat(s); if(isNaN(v)) return null;
  const cents=Math.round(Math.abs(v)*100); if(!cents) return null;
  return {cents, neg: neg || v<0};
}
function cleanMemo(s){ let d=(s||'').replace(/\s+/g,' ').trim().slice(0,42); return d? d.charAt(0).toUpperCase()+d.slice(1) : 'Lançamento'; }
function incomeDefaultCat(){ return catById('c_extra')?'c_extra':((db.categories.find(c=>c.type==='income')||{}).id); }

function parseOFX(text){
  const tagv=(b,t)=>{ const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i')); return m?m[1].trim():''; };
  const parts=text.split(/<STMTTRN>/i).slice(1);
  const out=[];
  parts.forEach(p=>{
    const money=moneyToCents(tagv(p,'TRNAMT')); if(!money) return;
    const desc=tagv(p,'MEMO')||tagv(p,'NAME')||tagv(p,'PAYEE');
    out.push({date:normDate((tagv(p,'DTPOSTED').match(/^(\d{4})(\d{2})(\d{2})/)||[]).slice(1).join('-')||''), desc, cents:money.cents, type:money.neg?'expense':'income'});
  });
  return out;
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const delim=(lines[0].split(';').length>lines[0].split(',').length)?';':',';
  const rows=lines.map(l=>l.split(delim).map(c=>c.replace(/^"|"$/g,'').trim()));
  const header=rows[0].some(c=>/data|date|valor|amount|descri|title|hist|lan[cç]/i.test(c));
  const out=[];
  for(let i=header?1:0;i<rows.length;i++){
    const r=rows[i]; if(r.length<2) continue;
    let di=-1; r.forEach((c,ix)=>{ if(di<0 && (/^\d{4}-\d{2}-\d{2}/.test(c)||/^\d{2}\/\d{2}\/\d{2,4}/.test(c))) di=ix; });
    let ai=-1; r.forEach((c,ix)=>{ if(ix!==di && ai<0){ const cc=c.replace(/\s/g,''); if(/\d/.test(cc)&&/^-?R?\$?-?\d+([.,]\d+)*-?$/.test(cc)) ai=ix; } });
    if(di<0||ai<0) continue;
    let desc=''; r.forEach((c,ix)=>{ if(ix!==di&&ix!==ai&&!/^\d+$/.test(c)&&c.length>desc.length) desc=c; });
    const money=moneyToCents(r[ai]); if(!money) continue;
    out.push({date:normDate(r[di]), desc:desc||'Lançamento', cents:money.cents, type:money.neg?'expense':'income'});
  }
  // Fatura de cartão vem toda positiva (só gastos). Se nada é negativo, trata tudo como despesa.
  if(out.length && out.every(t=>t.type==='income')) out.forEach(t=>t.type='expense');
  return out;
}

async function importExtrato(file){
  openSheet(`<div class="sh-head"><button id="shCancel">Cancelar</button><h2>Lendo extrato</h2><span></span></div><div class="body"><div class="imp-loading"><div class="spin"></div><div>Lendo o arquivo no seu aparelho...</div></div></div>`);
  sheetContent.querySelector('#shCancel').addEventListener('click',closeSheet);
  try{
    const text=await file.text();
    const isOFX=/<OFX>|OFXHEADER|<STMTTRN>/i.test(text);
    let raw=isOFX?parseOFX(text):parseCSV(text);
    raw=raw.filter(t=>t.cents>0);
    const items=raw.map(t=>{const c=t.type==='income'?incomeDefaultCat():appCatFor(t.desc); return {date:t.date, name:cleanMemo(t.desc), rawDesc:t.desc, cents:t.cents, type:t.type, cat:c, auto:c, on:true};});
    reviewExtrato(file.name.replace(/\.(ofx|csv)$/i,''), items);
  }catch(e){
    openSheet(`<div class="sh-head"><button id="shCancel">Fechar</button><h2>Não deu certo</h2><span></span></div><div class="body"><p style="color:var(--muted);font-size:14px">Não consegui ler esse arquivo. Exporte o extrato do Nubank ou da XP em OFX ou CSV e tente de novo.</p><p style="color:var(--muted);font-size:12px">Detalhe: ${esc(String(e.message||e))}</p></div>`);
    sheetContent.querySelector('#shCancel').addEventListener('click',closeSheet);
  }
}
function reviewExtrato(source, items){
  if(!items.length){
    openSheet(`<div class="sh-head"><button id="shCancel">Fechar</button><h2>Extrato vazio</h2><span></span></div><div class="body"><p style="color:var(--muted);font-size:14px">Não encontrei lançamentos nesse arquivo. Se for OFX/CSV do Nubank ou da XP e mesmo assim não leu, me manda o arquivo que eu ajusto o leitor.</p></div>`);
    sheetContent.querySelector('#shCancel').addEventListener('click',closeSheet); return;
  }
  const expCats=db.categories.filter(c=>c.type==='expense');
  const incCats=db.categories.filter(c=>c.type==='income');
  const draw=()=>{
    const on=items.filter(i=>i.on);
    const inTot=on.filter(i=>i.type==='income').reduce((s,i)=>s+i.cents,0);
    const outTot=on.filter(i=>i.type==='expense').reduce((s,i)=>s+i.cents,0);
    const rows=items.map((i,idx)=>{
      const cats=i.type==='income'?incCats:expCats;
      return `<div class="imp-row ${i.on?'on':'off'}">
        <button class="cb" data-toggle="${idx}" aria-label="Incluir">${i.on?'✓':''}</button>
        <div class="mid">
          <div class="nm">${esc(i.name)}</div>
          <div class="sub"><span class="dt">${dayLabel(i.date)}</span>
            <select data-cat="${idx}">${cats.map(c=>`<option value="${c.id}" ${c.id===i.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
          </div>
        </div>
        <div class="amt tnum" style="color:${i.type==='income'?'var(--pos)':'var(--text)'}">${i.type==='income'?'+':'−'} ${fmt(i.cents)}</div>
      </div>`;
    }).join('');
    openSheet(`
      <div class="sh-head"><button id="shCancel">Cancelar</button><h2>Revisar extrato</h2><span></span></div>
      <div class="body">
        <div class="imp-summary"><div class="b">${esc(source||'Extrato')}</div><div class="t tnum">+${fmt(inTot)} · −${fmt(outTot)}</div></div>
        <div class="imp-tools"><button id="selAll">Todas</button><button id="selNone">Nenhuma</button><span class="count">${on.length} de ${items.length}</span></div>
        ${rows}
        <button class="btn" id="impDo" style="margin-top:16px">Adicionar ${on.length} lançamento${on.length===1?'':'s'}</button>
        <p style="color:var(--muted);font-size:11.5px;text-align:center;margin-top:10px">Lançamentos repetidos (data, valor e nome) são ignorados automaticamente.</p>
      </div>`);
    sheetContent.querySelector('#shCancel').addEventListener('click',closeSheet);
    sheetContent.querySelector('#selAll').addEventListener('click',()=>{items.forEach(i=>i.on=true);draw();});
    sheetContent.querySelector('#selNone').addEventListener('click',()=>{items.forEach(i=>i.on=false);draw();});
    sheetContent.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.toggle;items[i].on=!items[i].on;draw();}));
    sheetContent.querySelectorAll('[data-cat]').forEach(s=>s.addEventListener('change',()=>{items[+s.dataset.cat].cat=s.value;}));
    sheetContent.querySelector('#impDo').addEventListener('click',()=>{
      const chosen=items.filter(i=>i.on);
      if(!chosen.length){ alert('Selecione ao menos um lançamento.'); return; }
      const existing=new Set(db.transactions.map(t=>t.date+'|'+t.type+'|'+t.amount+'|'+NORM(t.note||'').slice(0,20)));
      let add=0, dup=0, lastDate=null; const cats=new Set();
      chosen.forEach(i=>{
        const key=i.date+'|'+i.type+'|'+i.cents+'|'+NORM(i.name).slice(0,20);
        if(existing.has(key)){ dup++; return; }
        existing.add(key);
        db.transactions.push({id:uid(),type:i.type,amount:i.cents,categoryId:i.cat,date:i.date,note:i.name,_o:Date.now(),_extrato:1});
        add++; lastDate=i.date; if(i.type==='expense') cats.add(i.cat);
      });
      chosen.forEach(i=>{ if(i.type==='expense' && i.cat!==i.auto) sherlockLearn(i.rawDesc,i.cat); });
      save(); closeSheet();
      if(lastDate){ const [Y,M]=lastDate.split('-').map(Number); curY=Y; curM=M-1; }
      renderAll();
      if(cats.size){ checkGoals([...cats]); pushSync(); }
      alert(add+' lançamento'+(add===1?'':'s')+' adicionado'+(add===1?'':'s')+(dup?'. '+dup+' já existia'+(dup===1?'':'m')+' e foram ignorados.':'.'));
    });
  };
  draw();
}

/* ---------- BACKUP ---------- */
async function exportBackup(){
  const data=JSON.stringify(db,null,2);
  const fname='financas-backup-'+localDate(new Date())+'.json';
  // Inside the Claude artifact runtime, downloads go through the host.
  if(window.claude && typeof window.claude.use==='function'){
    try{ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:fname,data}); return; } }
    catch(e){ return; } // viewer declined or the sandbox blocked it
  }
  // Normal browser / hosted version.
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      if(!obj.categories||!Array.isArray(obj.transactions)) throw new Error('formato');
      if(!confirm('Isto vai substituir os dados atuais pelos do backup. Continuar?')) return;
      db=obj; save(); renderAll(); alert('Backup restaurado com sucesso.');
    }catch(e){ alert('Arquivo inválido. Selecione um backup gerado por este app.'); }
  };
  r.readAsText(file);
}

  if(e.target.closest('#learnBtn')){ learnSheet(); return; }
  if(e.target.closest('#lockBtn')){ lockSheet(); return; }
  if(e.target.closest('#notifBtn')){ if('Notification' in window){ Notification.requestPermission().then(p=>{ if(p==='granted') toast('Alertas ativados no celular.'); renderAll(); }); } else { toast('Este navegador não suporta notificações.'); } return; }
  if(e.target.closest('#pushBtn')){ enablePush(); return; }
  if(e.target.closest('#wipeBtn')){ if(confirm('Apagar TODOS os dados deste aparelho? Não dá para desfazer.')){ if(confirm('Tem certeza mesmo? Considere exportar um backup antes.')){ db=defaults(); save(); renderAll(); } } return; }
});
$('#app').addEventListener('change',e=>{
  if(e.target.id==='importFile' && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value=''; }
  if(e.target.id==='faturaFile' && e.target.files[0]){ importFatura(e.target.files[0]); e.target.value=''; }

renderAll();
applyPriv();
if(db.settings && db.settings.pinHash) showLock();
})();
